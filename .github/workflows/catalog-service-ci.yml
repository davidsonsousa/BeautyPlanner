name: Catalog Service CI

on:
  workflow_dispatch:

  push:
    branches: [ "feature/**", "develop" ]
    paths:
      - 'src/CatalogService/**'
      - 'src/BeautyPlanner.Shared/**'
      - '.github/workflows/catalog-service-ci.yml'
  pull_request:
    branches: [ "develop", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/CatalogService/BeautyPlanner.CatalogService.slnx

      - name: Verify formatting
        run: dotnet format src/CatalogService/BeautyPlanner.CatalogService.slnx --verify-no-changes

      - name: Build
        run: dotnet build src/CatalogService/BeautyPlanner.CatalogService.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

